<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Circle — Community</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#f6f4ef;--paper:#fffdf8;--ink:#20231f;--muted:#77766d;--line:#e2dfd6;--green:#163d35;--pale:#e8eee8;--gold:#9b8352;--shadow:0 16px 44px rgba(35,34,25,.055)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,textarea{font:inherit}button,a{cursor:pointer}a{color:inherit;text-decoration:none}.wrap{width:min(1080px,100% - 32px);margin:auto}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:14px}.brand{font:500 34px 'Playfair Display',serif;letter-spacing:-.04em}.right{display:flex;gap:8px;align-items:center}.btn{border:1px solid var(--line);border-radius:999px;padding:10px 15px;background:var(--paper);color:var(--ink);font-size:12px;font-weight:700}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn:disabled{opacity:.5;cursor:not-allowed}.intro{padding:42px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;font-weight:700;color:var(--green)}h1{font:500 clamp(38px,6vw,56px)/1.05 'Playfair Display',serif;letter-spacing:-.045em;margin:10px 0}.intro p,.sub{color:var(--muted);line-height:1.7}.intro p{max-width:720px;margin:0}.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start;margin-bottom:32px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px;min-width:0}.side{position:sticky;top:16px}.side h2,.chat-head h2{font:500 24px 'Playfair Display',serif;margin:0 0 8px}.nav{display:grid;gap:6px;margin-top:18px}.nav a{padding:12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:12px}.nav a.active,.nav a:hover{background:var(--pale);color:var(--green)}.privacy{background:#f3f1e8;border:1px solid #e5dfcd;border-radius:13px;padding:12px;margin-top:18px;font-size:11px;line-height:1.65;color:#655c48}.chat{display:flex;flex-direction:column;min-height:68vh;max-height:calc(100vh - 120px);padding:0;overflow:hidden}.chat-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.live{font-size:10px;color:var(--green);background:var(--pale);padding:7px 10px;border-radius:999px;white-space:nowrap;font-weight:700}.messages{padding:18px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px;min-height:260px}.msg{max-width:min(82%,600px);align-self:flex-start;border:1px solid var(--line);background:#fff;border-radius:15px 15px 15px 4px;padding:11px 13px;overflow-wrap:anywhere}.msg.mine{align-self:flex-end;background:var(--pale);border-color:#d4e0d5;border-radius:15px 15px 4px 15px}
.msg[data-module="Python"]{background:#e8eee8;border-color:#cbd9ce}
.msg[data-module="Java"]{background:#f3f1e8;border-color:#e5dfcd}
.msg[data-module="Machine Learning"]{background:#edf0f5;border-color:#d7dce7}
.msg[data-module="Circle learner"]{background:#fff;border-color:var(--line)}
.msg[data-role="mentor"],.msg[data-role="admin"]{background:#e4ece8;border-color:#b9cec4}
.msg[data-role="mentor"] .module,.msg[data-role="admin"] .module{color:var(--green)}
.msg-meta{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--muted);margin-bottom:5px}.module{font-weight:700;color:var(--green);letter-spacing:.03em}.msg-body{white-space:pre-wrap;line-height:1.6;font-size:13px}.composer{padding:14px;border-top:1px solid var(--line);background:#fffefa}.compose-row{display:flex;align-items:flex-end;gap:9px}.compose-row textarea{flex:1;resize:none;min-height:46px;max-height:130px;border:1px solid var(--line);background:white;border-radius:14px;padding:13px;outline:0;color:var(--ink)}.compose-row textarea:focus{border-color:#81958a;box-shadow:0 0 0 3px #e8eee8}.compose-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;font-size:10px;color:var(--muted)}.empty{text-align:center;padding:44px 14px;color:var(--muted);line-height:1.8}.toast{position:fixed;bottom:18px;left:50%;transform:translate(-50%,12px);background:var(--green);color:white;border-radius:999px;padding:12px 17px;font-size:12px;opacity:0;transition:.2s;z-index:10;max-width:calc(100% - 24px)}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-nav{display:none}.hidden{display:none!important}@media(max-width:720px){.wrap{width:calc(100% - 22px)}.top{height:64px}.brand{font-size:30px}.intro{padding:28px 0 18px}.layout{grid-template-columns:1fr;gap:10px}.side{position:static;padding:12px}.side h2{font-size:20px}.nav{display:flex;overflow:auto;margin-top:8px;gap:5px}.nav a{white-space:nowrap;padding:10px}.privacy{margin-top:10px}.chat{min-height:65vh;max-height:calc(100dvh - 270px);border-radius:16px}.chat-head{padding:15px}.chat-head h2{font-size:22px}.messages{padding:12px}.msg{max-width:90%}.composer{padding:10px}.compose-row .btn{padding:12px}.right .btn{padding:9px 11px}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">Circle<span style="color:var(--gold)">.</span></div><div class="right"><span id="moduleBadge" class="live">Private by design</span><a class="btn" href="index.html">← Back to Home</a></div></header><section class="intro"><div class="eyebrow">Circle / Community</div><h1>Community chat</h1><p>Connect with learners and mentors across Circle.</p></section><div class="layout"><main class="panel chat"><div class="chat-head"><div><div class="eyebrow">Shared room</div><h2>Open conversation</h2><div id="status" class="sub" style="font-size:11px;margin:0">Connecting securely…</div></div><span class="live">Text only</span></div><div id="messages" class="messages" aria-live="polite"><div class="empty">Loading community…</div></div><form id="composer" class="composer"><div class="compose-row"><textarea id="messageInput" maxlength="1000" rows="1" placeholder="Write a message…" aria-label="Message" required></textarea><button class="btn primary" id="sendBtn" type="submit">Send ↗</button></div><div class="compose-foot"><span>Max 1,000 characters · no images or attachments</span><span id="count">0 / 1000</span></div></form></main></div></div><div id="toast" class="toast"></div><script>
const SUPABASE_URL='https://idnzjzcryvgceryaftop.supabase.co',SUPABASE_KEY='sb_publishable_HgIwYunyGeB2HHxJvDVczA_4EY-7jc1';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let user=null,profile=null,channel=null,refreshTimer=null,seenIds=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function toast(s){$('toast').textContent=s;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2600)}function moduleLabel(v){const map={existing:'Python',python:'Python',btech:'Java',java:'Java',ml:'Machine Learning','machine learning':'Machine Learning'};return map[String(v||'').toLowerCase()]||'Circle learner'}function timeLabel(v){return new Date(v).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}
async function loadMessages(){const {data,error}=await sb.rpc('circle_community_read');if(error){$('status').textContent='Community setup is not complete.';$('messages').innerHTML='<div class="empty"><b>Community is almost ready.</b><br>Ask the site administrator to run <code>community_setup.sql</code> in Supabase SQL Editor, then reload this page.<br><br><small>'+esc(error.message)+'</small></div>';return}const rows=data||[];seenIds=new Set(rows.map(x=>x.id));$('status').textContent='Signed in anonymously · '+rows.length+' message'+(rows.length===1?'':'s')+' visible to you';if(!rows.length){$('messages').innerHTML='<div class="empty"><b>You’re all caught up.</b><br>New messages from the community will appear here until you view them.</div>';return}$('messages').innerHTML=rows.map(m=>{const ownRole=m.is_mine?(profile?.role||'learner'):'learner';const roleLabel=['mentor','admin'].includes(String(ownRole).toLowerCase())?'Mentor':moduleLabel(m.module);return `<article class="msg ${m.is_mine?'mine':''}" data-module="${esc(moduleLabel(m.module))}" data-role="${esc(ownRole)}"><div class="msg-meta"><span class="module">${esc(roleLabel)}</span><span>·</span><time>${timeLabel(m.created_at)}</time>${m.is_mine?'<span>· You</span>':''}</div><div class="msg-body">${esc(m.body)}</div></article>`}).join('');$('messages').scrollTop=$('messages').scrollHeight}
async function init(){const {data,error}=await sb.auth.getSession();if(error)throw error;if(!data.session){location.href='index.html';return}user=data.session.user;const {data:p,error:pe}=await sb.from('profiles').select('id,role,cohort').eq('id',user.id).maybeSingle();if(pe||!p)throw new Error('Circle profile could not be loaded.');profile=p;$('moduleBadge').textContent=moduleLabel(p.cohort);await loadMessages();channel=sb.channel('circle-community-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'circle_community_messages'},()=>loadMessages()).subscribe();refreshTimer=setInterval(loadMessages,12000)}
$('composer').addEventListener('submit',async e=>{e.preventDefault();const body=$('messageInput').value.trim();if(!body)return;if(body.length>1000)return toast('Messages can be up to 1,000 characters.');$('sendBtn').disabled=true;const {error}=await sb.rpc('circle_community_send',{p_body:body});$('sendBtn').disabled=false;if(error){toast(error.message||'Message could not be sent.');return}$('messageInput').value='';$('count').textContent='0 / 1000';await loadMessages()});$('messageInput').addEventListener('input',()=>{$('count').textContent=$('messageInput').value.length+' / 1000';$('messageInput').style.height='auto';$('messageInput').style.height=Math.min($('messageInput').scrollHeight,130)+'px'});$('messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&window.innerWidth>520){e.preventDefault();$('composer').requestSubmit()}});init().catch(e=>{$('status').textContent='Could not connect';$('messages').innerHTML='<div class="empty">'+esc(e.message||'Please sign in to Circle again.')+'</div>'});window.addEventListener('beforeunload',()=>{if(channel)sb.removeChannel(channel);clearInterval(refreshTimer)});
</script></body></html>
